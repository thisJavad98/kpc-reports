services:
  postgres:
    image: postgres:16-alpine
    container_name: kpc-reports-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kpc
      POSTGRES_PASSWORD: kpc
      POSTGRES_DB: kpc_reports
    volumes:
      - kpc_pg_data:/var/lib/postgresql/data

volumes:
  kpc_pg_data:
